# 工作流名称
name: ci       

# 工作流开关
on:
  # 远程推送代码时触发
  push: 
    # 只有推送代码到master分支才触发
    branches:
      - master
      # pr时触发
  pull_request:

# 定义任务
jobs:
  # 任务名称
  build:
    # 为作业设置操作系统
    runs-on: ubuntu-latest
    steps:
         # github检出代码，可设置名称
      - name: Checkout
        # 使用的操作
        uses: actions/checkout@v4

      - name: Extract Docker image metadata
        # 步骤的唯一标识符。您可以使用此 ID 在上下文中引用该步骤。
        id: meta 
        uses: docker/metadata-action@v5.8.0
        with:
          # 用于作为标签基础名称的 Docker 镜像列表
          images: ${{secrets.DOCKER_USERNAME}}/test
        env:
          # 配置注解级别，默认是manifest(清单),以下为清单和索引都创建注解
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.5.0
        with:
          # docker的用户名，密码，以及是否登出
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true
          
        # 设置builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with: 
          # 默认是docker-container驱动
          driver: docker-container
          # 当前正在使用,默认为true
          use: true
          # 可定义builder名称
          name: my-builder
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # 条件判断，当不是pr时触发
          push: ${{ github.event_name != 'pull_request' }}
          # 要使用的dockerfile文件
          file: test.Dockerfile
          # tag号
          tags: ${{secrets.DOCKER_USERNAME}}/test:1.0.1
          # 注解
          annotations: ${{ steps.meta.outputs.annotations }}
          # 来源证明，max为最高级别，min可选
          provenance: mode=max
          # Software Bill of Material，软件物料清单，自动生成
          sbom: true
          
      - name: Debug metadata
        run: |
          echo "=== TAGS OUTPUT ==="
          echo "${{ steps.meta.outputs.tags }}"
          echo "--------------------------------"
          echo "=== ANNOTATIONS OUTPUT ==="
          echo "${{ steps.meta.outputs.annotations }}"
          
      - name: 构建完成
        run: echo "success!"
